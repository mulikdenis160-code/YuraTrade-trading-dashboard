kind = "web"
previewPath = "/"
title = "Trading Signals Dashboard"
description = "Russian-language trading-signal dashboard with live Pocket Option WebSocket quotes, including OTC pairs. Authorization is read only from Replit Secrets; the app does not reuse archive credentials or place trades."
version = "1.0.0"
id = "artifacts/yuratrade"
router = "path"

[[services]]
name = "web"
paths = [ "/", "/api/ticks" ]
localPort = 18682

[services.development]
run = "pnpm --filter @workspace/yuratrade run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/yuratrade", "run", "build" ]
serve = "static"
publicDir = "artifacts/yuratrade/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18682"
BASE_PATH = "/"
