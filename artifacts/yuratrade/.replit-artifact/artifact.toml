kind = "web"
previewPath = "/"
title = "PRIME BOT"
description = "Russian-, Ukrainian-, and English-language dashboard for read-only Pocket Option currency-pair signals, including OTC pairs. The app does not place trades."
version = "1.0.0"
id = "artifacts/yuratrade"
router = "path"

[[services]]
name = "web"
paths = [ "/", "/api/ticks" ]
localPort = 18682

[services.development]
run = "pnpm --filter @workspace/yuratrade run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/yuratrade", "run", "build" ]

[services.production.run]
args = [ "pnpm", "--filter", "@workspace/yuratrade", "run", "serve" ]

[services.production.run.env]
PORT = "18682"
BASE_PATH = "/"
NODE_ENV = "production"

[services.production.health.startup]
path = "/"

[services.env]
PORT = "18682"
BASE_PATH = "/"