kind = "web"
previewPath = "/"
title = "Trading Signals Dashboard"
description = "Russian-language trading-signal dashboard from the uploaded archive, with pair selection, signal history, learning pages, and a balance calculator. The Pocket Option live feed remains disabled until a fresh authorization is configured."
version = "1.0.0"
id = "artifacts/yuratrade"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18682

[services.development]
run = "pnpm --filter @workspace/yuratrade run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/yuratrade", "run", "build" ]
serve = "static"
publicDir = "artifacts/yuratrade/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18682"
BASE_PATH = "/"
